name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate purple snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: scrmvv
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#a78bfa&color_dots=#0b1022,#292249,#44356d,#7760af,#b1a0ef

      - name: Publish SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
